# covsyn-pipeline settings (Task 4); `covsyn-pipeline --config default` reads this file.
# The values are phase_d_chain.sh's defaults at b30c141, where each was an environment variable.

[optimise]
mode = "train"
config_name = "phase-d"   # the name in a new run id
stream = 1                # Task 7: the optimisation stream, 1 to 99, one per run
# B49's warm starts (run 10, and run 19) are rows of variable/initial_population_v1.npz since
# Task 7; the warm_start setting is gone.

[revalidate]
enabled = true   # B56, E87 (REVALIDATE)
blocks = 10      # E95: 4 left the choice noisy (REVALIDATION_BLOCKS)
stream = 200     # Task 7: the validation stream, 200 to 299, one per use

[select]
enabled = true   # B60 (SELECT)
top = 5          # candidates the checklist chooses among (SELECT_TOP)

[synthesise]
monte_carlo = 1000              # A5: at least 1000; 100 was shown to be unreliable
# B60's independent seeds (500000..) are stream 300 since Task 7, and the seeds the candidate
# is chosen on (0..999) stream 301; the independent_seed_start setting is gone.

[check]
age_rr_cases = 20000   # E68: about 4300 infections over the four age bands; Task 7: measured
                       # twice, on stream 301 for checks.json and 300 for checks_independent.json;
                       # the selection measures its own 20000 on stream 301 whatever is set here,
                       # so another value gives both checklists' B14 more or fewer seeds than
                       # the selection scored
previous_checks = ""   # checks.json of the previous run, to compare with (PREVIOUS_CHECKS)

[run]
workers = 0   # 0: each step's own default (Task 2); otherwise COVSYN_WORKERS for every step
