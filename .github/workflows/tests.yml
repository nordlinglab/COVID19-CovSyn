#
# Install from uv.lock and run the fast tests on Linux and macOS (rework plan, Task 1).
# The slow regression tests take minutes per test on many cores, so they run by hand on the
# machines that do the optimisation.
name: tests

on:
  push:
    branches: [main]
  pull_request:

# The job only reads the repository, so its token gets nothing more (least privilege).
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -m "not slow"
